name: Verify application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dpl
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: dpl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dpl -d dpl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dpl:test_only_password@localhost:5432/dpl_test?schema=public
      TOKEN_SECRET: ci-test-only-secret-012345678901234567890
      TEST_DATABASE_CONFIRMED: 'true'
      APP_ORIGIN: http://localhost:5173
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (commit a reviewed lockfile before release)
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: node --experimental-strip-types --test tests/security.node.mjs
      - run: npm test
      - run: npm run build
